version: 2
updates:
  # pnpm uses the npm ecosystem; only the WASM package has a JS manifest and lockfile.
  - package-ecosystem: "npm"
    directory: "/bindings/wasm"
    schedule:
      interval: "weekly"

  # The root Cargo workspace covers the core, WASM binding and xtask.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"

  # GitHub Actions always uses the repository root, not /.github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
